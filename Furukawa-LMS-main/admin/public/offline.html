<!doctype html>
<html lang="en">
<head>

  <title>Offline — Furukawa Minda LMS</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;

      margin-top: 20px;
      padding: 10px 20px;
      border: none;

      color: #fff;
      font-size: 0.9rem;
      cursor: pointer;
    }
  </style>

<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>This page hasn't been saved for offline use. Reconnect to the internet to continue, or revisit a course you've already opened.</p>
