<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lottie Viewer</title>
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      background: #f1f5f9;
    }
    .container {
      display: flex;
      gap: 40px;
      margin-top: 20px;
    }
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 340px;
    }
    h2 {
      margin-bottom: 10px;
      color: #1e293b;
    }
  </style>
</head>
<body>
  <h1>Lottie Animations Viewer</h1>
  <div class="container">
    <div class="card">
      <h2>Animation 1 (zyquagfl)</h2>
      <lottie-player
        src="https://assets4.lottiefiles.com/packages/lf20_zyquagfl.json"
        background="transparent"
        speed="1"
        style="width: 300px; height: 300px;"
        loop
        autoplay>
      </lottie-player>
    </div>
    <div class="card">
      <h2>Animation 2 (GoeyCV7pi2)</h2>
      <lottie-player
        src="https://assets5.lottiefiles.com/packages/lf20_GoeyCV7pi2.json"
        background="transparent"
        speed="1"
        style="width: 300px; height: 300px;"
        loop
        autoplay>
      </lottie-player>
    </div>
  </div>
</body>
</html>
